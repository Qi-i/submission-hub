name: Workspace Recovery One Shot

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'fix/journal-preparation-figure-reset-final-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply recovery preflight
        run: node scripts/preflight-workspace-recovery.mjs
      - name: Apply recovery patch
        run: node scripts/apply-workspace-recovery.mjs
      - name: Verify recovery contract and types
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-verification-key
          VITE_ADMIN_ID: build-verification-admin
        run: |
          npm run check:workspace-recovery
          npm run check:figure-studio
          npm run check:preparation-unified
          npm run typecheck
      - name: Commit product changes and self-delete
        run: |
          rm scripts/preflight-workspace-recovery.mjs
          rm scripts/apply-workspace-recovery.mjs
          rm .github/workflows/workspace-recovery-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover Journal Center and Figure Composer workspaces"
          git push origin HEAD:${{ github.head_ref }}
