name: PR110 Repair Regressions
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'refactor/preparation-unified-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/preparation-unified-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/pr110_repair_regressions.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run check:figure-studio
      - name: Commit repair and remove temporary runner
        run: |
          rm -f scripts/pr110_repair_regressions.py .github/workflows/pr110-repair-regressions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Repair journal center and Preparation geometry"
          git push origin HEAD:refactor/preparation-unified-workspace
