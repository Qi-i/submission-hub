name: Temporary X theme token split

on:
  push:
    branches: [fix/dark-theme-bluegray-refinement]
    paths:
      - '.github/workflows/_temporary-x-token-split.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-theme-bluegray-refinement
          fetch-depth: 0
      - name: Apply theme-specific X token contract
        run: python scripts/_temporary_patch_x_tokens.py
      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/luminous-x-rebuild.css tests/visual/luminous-x-layout-check.mjs
          git rm scripts/_temporary_patch_x_tokens.py .github/workflows/_temporary-x-token-split.yml
          git commit -m "Scope restrained Luminous X accents to dark mode"
          git push origin HEAD:fix/dark-theme-bluegray-refinement
