name: Temporary X dark card status patch

on:
  push:
    branches: [fix/dark-theme-bluegray-refinement]
    paths:
      - '.github/workflows/_temporary-dark-card-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-theme-bluegray-refinement
          fetch-depth: 0
      - name: Replace near-black X status card variables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/luminous-x-rebuild-corrections.css')
          text = path.read_text(encoding='utf-8')
          replacements = {
            "--paper-card-start: #1b1a37;\n  --paper-card-end: #11182d;\n  --paper-card-border: #34315a;": "--paper-card-start: #2b3041;\n  --paper-card-end: #273340;\n  --paper-card-border: #4c5570;",
            "--paper-card-start: #10283a;\n  --paper-card-end: #11182d;\n  --paper-card-border: #28506a;": "--paper-card-start: #243b47;\n  --paper-card-end: #273340;\n  --paper-card-border: #3f6675;",
            "--paper-card-start: #2d2414;\n  --paper-card-end: #11182d;\n  --paper-card-border: #5d4a25;": "--paper-card-start: #3a3529;\n  --paper-card-end: #273340;\n  --paper-card-border: #66583a;",
            "--paper-card-start: #291936;\n  --paper-card-end: #11182d;\n  --paper-card-border: #513163;": "--paper-card-start: #342e3d;\n  --paper-card-end: #273340;\n  --paper-card-border: #604f69;",
            "--paper-card-start: #132b22;\n  --paper-card-end: #11182d;\n  --paper-card-border: #28533f;": "--paper-card-start: #283a36;\n  --paper-card-end: #273340;\n  --paper-card-border: #466657;",
            "--paper-card-start: #30191f;\n  --paper-card-end: #11182d;\n  --paper-card-border: #61303a;": "--paper-card-start: #3a2d31;\n  --paper-card-end: #273340;\n  --paper-card-border: #6b4d53;",
            "--paper-card-start: #1a2230;\n  --paper-card-end: #11182d;\n  --paper-card-border: #354153;": "--paper-card-start: #2f3944;\n  --paper-card-end: #273340;\n  --paper-card-border: #4d5d6c;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'status source fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Keep the updated visual-contract block readable after the previous scripted edit.
          path = Path('tests/visual/luminous-layout-check.mjs')
          text = path.read_text(encoding='utf-8')
          old = """    if (expectedUi === 'luminous') {
            const luminousCyan = rootStyle.getPropertyValue('--luminous-cyan').trim().toLowerCase()
            const expectedCyan = root.dataset.theme === 'dark' ? '#72c8df' : '#3cf5ff'
            if (luminousCyan !== expectedCyan) failures.push(`${name}: luminous cyan design token is unexpected (${luminousCyan || 'missing'})`)
          }"""
          new = """    if (expectedUi === 'luminous') {
              const luminousCyan = rootStyle.getPropertyValue('--luminous-cyan').trim().toLowerCase()
              const expectedCyan = root.dataset.theme === 'dark' ? '#72c8df' : '#3cf5ff'
              if (luminousCyan !== expectedCyan) failures.push(`${name}: luminous cyan design token is unexpected (${luminousCyan || 'missing'})`)
            }"""
          # Formatting-only: tolerate if GitHub's block normalization already matches either representation.
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit X status surface fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/luminous-x-rebuild-corrections.css tests/visual/luminous-layout-check.mjs
          git commit -m "Lift Luminous X status cards from near-black"
          git push origin HEAD:fix/dark-theme-bluegray-refinement
