name: Release Offline HTML

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.5.0
      title:
        description: Release title
        required: true
        default: Submission Hub v1.5.0

permissions:
  contents: write

jobs:
  release-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete release verification
        run: npm run verify
      - name: Prepare offline asset
        run: mkdir -p release && cp dist-offline/offline.html release/submission-hub-offline.html
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
          RELEASE_NOTES: |
            Submission Hub v1.5.0

            主要更新：
            - Luminous 与 Luminous X 两套界面完整保留，导航、主题、桌面和移动端布局统一
            - 投稿准备、投稿管理、期刊库、个人统计和附件归档形成完整论文工作流
            - 期刊库新增中文名、缩写、中文简介、选刊标签、备注和自定义卡片外显
            - 公开审稿指标读取覆盖首轮决定、投稿至接收周期和接收率
            - 私有附件覆盖上传、预览、替换、删除和生命周期清理
            - 在线版、离线版、隐私检查和视觉回归全部纳入发布验证

            使用说明与完整变更记录见仓库 README 和 docs/releases/v1.5.0.md。

            附件：submission-hub-offline.html
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/submission-hub-offline.html --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG_NAME" release/submission-hub-offline.html --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          fi
