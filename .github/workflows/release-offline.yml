name: Release Offline HTML

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to package.json version
        required: false
      title:
        description: Optional release title; defaults to Submission Hub plus version
        required: false
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: release-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: metadata
        name: Resolve release metadata
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REQUESTED_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="${REQUESTED_TAG:-v${VERSION}}"
          RELEASE_TITLE="${REQUESTED_TITLE:-Submission Hub v${VERSION}}"
          RELEASE_NOTES="docs/releases/v${VERSION}.md"

          test "$TAG_NAME" = "v${VERSION}"
          test -s "$RELEASE_NOTES"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "notes=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"
      - name: Synchronize package lock with package version
        run: npm version "${{ steps.metadata.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete release verification
        run: npm run verify
      - name: Prepare offline asset
        run: mkdir -p release && cp dist-offline/offline.html release/submission-hub-offline.html
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/submission-hub-offline.html --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG_NAME" release/submission-hub-offline.html \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES" \
              --latest
          fi
      - name: Publish release summary
        run: |
          {
            echo "## Released ${{ steps.metadata.outputs.tag }}"
            echo
            echo "- Verification: passed"
            echo "- Offline asset: submission-hub-offline.html"
            echo "- Notes: ${{ steps.metadata.outputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"
