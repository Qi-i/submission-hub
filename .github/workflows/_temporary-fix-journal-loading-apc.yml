name: Temporary fix journal loading and APC CNY

on:
  push:
    branches:
      - fix/journal-loading-apc-cny
    paths:
      - .github/workflows/_temporary-fix-journal-loading-apc.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journal-loading-apc-cny
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/_temp_fix_journal_loading_apc.py

      - name: Validate patch
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Commit implementation and remove helpers
        run: |
          git config user.name "Zhiqi Liu"
          git config user.email "118270330+Qi-i@users.noreply.github.com"
          git rm .github/workflows/_temporary-fix-journal-loading-apc.yml .github/scripts/_temp_fix_journal_loading_apc.py
          git add src/components/OnlinePreparationWorkspace.tsx src/components/PreparationWorkspace.tsx src/components/ApcAutoConverter.tsx src/journal-center-loading-apc-polish.css src/app-styles.ts tests/visual/journal-center-header-filter-check.mjs
          git commit -m "Fix journal loading state and show APC in CNY"
          git push origin HEAD:fix/journal-loading-apc-cny
