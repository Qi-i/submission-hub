name: Temporary remove X dark card glow

on:
  push:
    branches:
      - fix/dark-card-readability-balance
    paths:
      - .github/workflows/_temporary-remove-x-dark-card-glow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-card-readability-balance
          fetch-depth: 0
      - name: Remove X dark card status glow
        run: python .github/remove-x-dark-card-glow.py
      - name: Validate changes
        run: git diff --check
      - name: Commit changes and remove temporary helpers
        run: |
          rm .github/workflows/_temporary-remove-x-dark-card-glow.yml .github/remove-x-dark-card-glow.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Luminous X dark card status glow"
          git push origin HEAD:fix/dark-card-readability-balance
