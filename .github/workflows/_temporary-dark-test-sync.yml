name: Temporary dark test synchronization

on:
  push:
    branches: [fix/dark-theme-bluegray-refinement]
    paths:
      - '.github/workflows/_temporary-dark-test-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-theme-bluegray-refinement
          fetch-depth: 0
      - name: Synchronize visual contracts with restrained dark palette
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/visual/luminous-layout-check.mjs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"    if \(expectedUi === 'luminous' && rootStyle\.getPropertyValue\('--luminous-cyan'\)\.trim\(\)\.toLowerCase\(\) !== '#3cf5ff'\) \{\n"
              r"      failures\.push\(`\$\{name\}: luminous cyan design token is missing`\)\n"
              r"    \}"
          )
          replacement = """    if (expectedUi === 'luminous') {
              const luminousCyan = rootStyle.getPropertyValue('--luminous-cyan').trim().toLowerCase()
              const expectedCyan = root.dataset.theme === 'dark' ? '#72c8df' : '#3cf5ff'
              if (luminousCyan !== expectedCyan) failures.push(`${name}: luminous cyan design token is unexpected (${luminousCyan || 'missing'})`)
            }"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'luminous cyan assertion replacement count={count}')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/visual/dark-theme-contract-check.mjs')
          text = path.read_text(encoding='utf-8')
          old = "fail(`${ui}/${card.status}: card contains a near-black surface (minimum average ${Math.min(...values).toFixed(1)})`)"
          new = "fail(`${ui}/${card.status}: card contains a near-black surface (minimum average ${Math.min(...values).toFixed(1)}; backgroundColor=${card.backgroundColor.value}; backgroundImage=${card.backgroundImage})`)"
          if old not in text:
              raise SystemExit('dark card diagnostic assertion source not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit test contract synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/luminous-layout-check.mjs tests/visual/dark-theme-contract-check.mjs
          git commit -m "Update dark visual regression contracts"
          git push origin HEAD:fix/dark-theme-bluegray-refinement
