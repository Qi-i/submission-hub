name: Apply Figure Composer Integration Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/figure-composer-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/online-figure-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/online-figure-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate Figure Composer into Preparation
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replaceRequired(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`Patch anchor missing: ${label}`)
            return source.replace(from, to)
          }

          const prepPath = 'src/components/PreparationWorkspace.tsx'
          let prep = fs.readFileSync(prepPath, 'utf8')
          prep = replaceRequired(prep,
            "import { useEffect, useMemo, useState } from 'react'",
            "import { lazy, Suspense, useEffect, useMemo, useState } from 'react'",
            'Preparation React import')
          prep = replaceRequired(prep,
            "  FilePenLine, LayoutDashboard, Lightbulb, LoaderCircle, Plus, Scale, Search, Star, Target,",
            "  ClipboardCheck, FilePenLine, Images, LayoutDashboard, Lightbulb, LoaderCircle, PackageCheck, Plus, Scale, Search, Star, Target,",
            'Preparation icons')
          prep = replaceRequired(prep,
            "import { useTheme } from '../lib/theme'\n\ntype SectionKey = 'overview' | 'topics' | 'drafts' | 'journals' | 'compare'",
            "import { useTheme } from '../lib/theme'\n\nconst FigureComposer = lazy(() => import('./figure-composer/FigureComposer'))\n\ntype SectionKey = 'overview' | 'paper' | 'figures' | 'materials' | 'match' | 'check' | 'topics' | 'drafts' | 'journals' | 'compare'",
            'Preparation sections')
          prep = replaceRequired(prep,
            "  onPromoteDraft?: (draft: ManuscriptDraft) => Promise<void>\n  onLookupJournalRanks?: (publicationName: string) => Promise<JournalRankLookupResult>\n}",
            "  onPromoteDraft?: (draft: ManuscriptDraft) => Promise<void>\n  onLookupJournalRanks?: (publicationName: string) => Promise<JournalRankLookupResult>\n  onDraftFigureCountChange?: (draftId: string, count: number) => Promise<void> | void\n}",
            'Figure count prop')
          prep = replaceRequired(prep,
            "  onSaveDraft, onDeleteDraft,\n  onPromoteDraft, onLookupJournalRanks,\n}: Props)",
            "  onSaveDraft, onDeleteDraft,\n  onPromoteDraft, onLookupJournalRanks, onDraftFigureCountChange,\n}: Props)",
            'Figure count destructure')

          const oldNav = `    <div className="prep-nav">
      <button data-tone="overview" className={section === 'overview' ? 'active' : ''} onClick={() => setSection('overview')}>
        <LayoutDashboard size={14} /> 总览
      </button>
      <button data-tone="topic" className={section === 'topics' ? 'active' : ''} onClick={() => setSection('topics')}>
        <Lightbulb size={14} /> 选题池 <span>{normalized.topics.length}</span>
      </button>
      <button data-tone="draft" className={section === 'drafts' ? 'active' : ''} onClick={() => setSection('drafts')}>
        <FilePenLine size={14} /> 草稿准备 <span>{normalized.drafts.length}</span>
      </button>
      <button data-tone="journal" className={section === 'journals' ? 'active' : ''} onClick={() => setSection('journals')}>
        <BookOpen size={14} /> 期刊库 <span>{normalized.journals.length}</span>
      </button>
      <button data-tone="compare" className={section === 'compare' ? 'active' : ''} onClick={() => setSection('compare')}>
        <Scale size={14} /> 期刊比较
      </button>
    </div>`
          const newNav = `    <div className="prep-nav prep-nav-primary" aria-label="投稿准备核心工作区">
      <button data-tone="overview" className={section === 'overview' ? 'active' : ''} onClick={() => setSection('overview')}>
        <LayoutDashboard size={14} /> 总览
      </button>
      <button data-tone="paper" className={['paper', 'topics', 'drafts'].includes(section) ? 'active' : ''} onClick={() => setSection('paper')}>
        <FilePenLine size={14} /> 论文准备 <span>{normalized.drafts.length}</span>
      </button>
      <button data-tone="figures" className={section === 'figures' ? 'active' : ''} onClick={() => setSection('figures')}>
        <Images size={14} /> 科研组图
      </button>
      <button data-tone="materials" className={section === 'materials' ? 'active' : ''} onClick={() => setSection('materials')}>
        <PackageCheck size={14} /> 投稿材料
      </button>
      <button data-tone="match" className={['match', 'journals', 'compare'].includes(section) ? 'active' : ''} onClick={() => setSection('match')}>
        <Target size={14} /> 期刊匹配 <span>{normalized.journals.length}</span>
      </button>
      <button data-tone="check" className={section === 'check' ? 'active' : ''} onClick={() => setSection('check')}>
        <ClipboardCheck size={14} /> 投稿前检查
      </button>
    </div>`
          prep = replaceRequired(prep, oldNav, newNav, 'Primary Preparation navigation')

          const legacyAnchor = "    {section === 'topics' && <div className=\"prep-card-grid\">"
          const primarySections = `    {section === 'paper' && <div className="prep-primary-section-grid">
      <section className="prep-panel prep-panel-topic">
        <PanelHead title="选题与研究设计" subtitle="从研究问题推进到可执行论文草稿" onClick={() => setSection('topics')} />
        <div className="prep-topic-strip">
          {orderedTopics.slice(0, 5).map(topic => <TopicCard key={topic.id} topic={topic} onClick={() => setEditor({ type: 'topic', value: topic })} onCreateDraft={() => void createDraftFromTopic(topic)} creating={creatingTopicId === topic.id} compact />)}
          {!orderedTopics.length && <Empty text="尚无研究选题" action="新增选题" onClick={() => setEditor({ type: 'topic', value: 'new' })} />}
        </div>
      </section>
      <section className="prep-panel prep-panel-draft">
        <PanelHead title="论文草稿" subtitle="正文、图表、作者、清单与目标期刊统一推进" onClick={() => setSection('drafts')} />
        <div className="prep-overview-draft-list">
          {orderedDrafts.slice(0, 5).map(draft => <DraftCard key={draft.id} draft={draft} topic={draft.topic_id ? topicMap.get(draft.topic_id) : undefined} journals={draft.target_journal_ids.map(id => journalMap.get(id)).filter(Boolean) as JournalProfile[]} primaryJournal={draft.primary_journal_id ? journalMap.get(draft.primary_journal_id) : undefined} onEdit={() => setEditor({ type: 'draft', value: draft })} onPromote={onPromoteDraft ? () => promote(draft) : undefined} promoting={promotingId === draft.id} compact />)}
          {!orderedDrafts.length && <Empty text="尚无论文草稿" action="新建草稿" onClick={() => setEditor({ type: 'draft', value: 'new' })} />}
        </div>
      </section>
    </div>}

    {section === 'figures' && <div className="prep-figure-bridge">
      <Suspense fallback={<div className="prep-loading"><div className="prep-loading-shell"><LoaderCircle className="prep-loading-icon" size={22} /><div className="prep-loading-copy"><strong>正在加载科研组图工作区</strong><span>图像处理仍在当前浏览器完成。</span></div></div></div>}>
        <FigureComposer drafts={normalized.drafts} onDraftFigureCountChange={onDraftFigureCountChange} />
      </Suspense>
    </div>}

    {section === 'materials' && <>
      <div className="prep-primary-section-head"><div><h2>投稿材料</h2><p>围绕每篇 Manuscript Draft 集中核对主文、图表、Cover Letter、Highlights、补充材料和文件命名。</p></div><button className="btn btn-primary btn-sm" onClick={() => setEditor({ type: 'draft', value: 'new' })}><Plus size={13} /> 新建草稿</button></div>
      <div className="prep-draft-list">
        {orderedDrafts.map(draft => <DraftCard key={draft.id} draft={draft} topic={draft.topic_id ? topicMap.get(draft.topic_id) : undefined} journals={draft.target_journal_ids.map(id => journalMap.get(id)).filter(Boolean) as JournalProfile[]} primaryJournal={draft.primary_journal_id ? journalMap.get(draft.primary_journal_id) : undefined} onEdit={() => setEditor({ type: 'draft', value: draft })} onPromote={onPromoteDraft ? () => promote(draft) : undefined} promoting={promotingId === draft.id} />)}
        {!orderedDrafts.length && <Empty text="尚无可整理投稿材料的草稿" action="新建草稿" onClick={() => setEditor({ type: 'draft', value: 'new' })} />}
      </div>
    </>}

    {section === 'match' && <>
      <div className="prep-primary-section-head"><div><h2>期刊匹配</h2><p>把收藏期刊、关键分区、费用、审稿周期和横向比较放在同一工作区。</p></div><button className="btn btn-journal-primary btn-sm" onClick={() => setEditor({ type: 'journal', value: 'new' })}><Star size={13} /> 收藏期刊</button></div>
      <div className="prep-card-grid journal-grid">
        {orderedJournals.map(journal => <JournalCard key={journal.id} journal={journal} onClick={() => setEditor({ type: 'journal', value: journal })} />)}
        {!orderedJournals.length && <Empty text={query ? '没有匹配的期刊' : '尚未收藏期刊'} action="收藏期刊" onClick={() => setEditor({ type: 'journal', value: 'new' })} />}
      </div>
      {!!orderedJournals.length && <JournalComparison journals={orderedJournals} onEdit={journal => setEditor({ type: 'journal', value: journal })} />}
    </>}

    {section === 'check' && <>
      <div className="prep-primary-section-head"><div><h2>投稿前检查</h2><p>用草稿清单和就绪度集中暴露缺失项；科研组图中的分辨率、越界、重叠、拉伸和图注检查在“科研组图”内完成。</p></div><button className="btn btn-ghost btn-sm" onClick={() => setSection('figures')}><Images size={13} /> 检查科研图件</button></div>
      <div className="prep-check-grid">
        {orderedDrafts.map(draft => { const readiness = draftReadiness(draft); return <article key={draft.id} className="prep-check-card"><h3>{draft.title}</h3><b>{readiness.score}%</b><p>必需项完成度 {checklistProgress(draft.checklist)}%</p><p>{readiness.blockers[0] || readiness.warnings[0] || '未发现阻碍投稿的必需项。'}</p><button className="btn btn-ghost btn-sm" onClick={() => setEditor({ type: 'draft', value: draft })}>打开草稿检查</button></article> })}
        {!orderedDrafts.length && <Empty text="尚无可检查的论文草稿" action="新建草稿" onClick={() => setEditor({ type: 'draft', value: 'new' })} />}
      </div>
    </>}

`
          prep = replaceRequired(prep, legacyAnchor, primarySections + legacyAnchor, 'Primary Preparation content')
          fs.writeFileSync(prepPath, prep)

          const onlinePath = 'src/components/OnlinePreparationWorkspace.tsx'
          let online = fs.readFileSync(onlinePath, 'utf8')
          online = replaceRequired(online,
            "import { useCallback, useEffect, useRef, useState } from 'react'",
            "import { lazy, Suspense, useCallback, useEffect, useRef, useState } from 'react'",
            'Online React import')
          online = replaceRequired(online,
            "import FigureStudio from './FigureStudio'",
            "const FigureComposer = lazy(() => import('./figure-composer/FigureComposer'))",
            'Online Figure Composer import')
          const promoteAnchor = "  const promoteDraft = async (draft: ManuscriptDraft) => {"
          const syncMethod = `  const syncDraftFigureCount = useCallback(async (draftId: string, count: number) => {
    const updatedAt = new Date().toISOString()
    const { error: figureCountError } = await (supabase.from('manuscript_drafts') as any)
      .update({ figure_count: Math.max(0, count), updated_at: updatedAt })
      .eq('id', draftId)
    if (figureCountError) throw figureCountError
    setSnapshot(current => ({
      ...current,
      drafts: current.drafts.map(draft => draft.id === draftId ? { ...draft, figure_count: Math.max(0, count), updated_at: updatedAt } : draft),
    }))
  }, [])

`
          online = replaceRequired(online, promoteAnchor, syncMethod + promoteAnchor, 'Figure count sync')
          online = replaceRequired(online,
            "? <FigureStudio onBack={() => setWorkspaceMode('preparation')} />",
            "? <Suspense fallback={<div className=\"prep-loading\"><div className=\"prep-loading-shell\"><div className=\"prep-loading-copy\"><strong>正在加载科研组图</strong><span>正在初始化本地图片工作区…</span></div></div></div>}><FigureComposer drafts={snapshot.drafts} onDraftFigureCountChange={syncDraftFigureCount} onBack={() => setWorkspaceMode('preparation')} /></Suspense>",
            'Online Figure Composer render')
          online = replaceRequired(online,
            "onPromoteDraft={promoteDraft} onLookupJournalRanks={lookupJournalRanks} />}",
            "onPromoteDraft={promoteDraft} onLookupJournalRanks={lookupJournalRanks} onDraftFigureCountChange={syncDraftFigureCount} />}",
            'Preparation figure count callback')
          fs.writeFileSync(onlinePath, online)

          const stylesPath = 'src/app-styles.ts'
          let styles = fs.readFileSync(stylesPath, 'utf8')
          styles = replaceRequired(styles, "import './figure-studio.css'", "import './figure-composer.css'", 'Figure stylesheet import')
          fs.writeFileSync(stylesPath, styles)

          fs.rmSync('src/components/FigureStudio.tsx', { force: true })
          fs.rmSync('src/figure-studio.css', { force: true })
          fs.rmSync('.github/workflows/figure-composer-integration-patch.yml', { force: true })
          NODE
      - name: Commit integration patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate Figure Composer into Preparation"
          git push origin HEAD:feat/online-figure-studio
