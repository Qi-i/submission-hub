name: Verify UI Geometry Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/visual/ui-geometry-contract-check.mjs'
      - 'tests/visual/journal-center-header-filter-check.mjs'
      - 'tests/visual/header-action-coherence-check.mjs'
      - 'tests/visual/responsive-workspace-density-check.mjs'
      - 'tests/visual/submission-grid-parity-check.mjs'
      - 'tests/visual/dark-theme-contract-check.mjs'
      - '.github/workflows/ui-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/visual/ui-geometry-contract-check.mjs'
      - 'tests/visual/journal-center-header-filter-check.mjs'
      - 'tests/visual/header-action-coherence-check.mjs'
      - 'tests/visual/responsive-workspace-density-check.mjs'
      - 'tests/visual/submission-grid-parity-check.mjs'
      - 'tests/visual/dark-theme-contract-check.mjs'
      - '.github/workflows/ui-contract.yml'

permissions:
  contents: read

concurrency:
  group: ui-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build visual harness
        run: npm run typecheck && npx vite build --config vite.config.visual.ts
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1
      - name: Start visual preview
        run: |
          npx vite preview --config vite.config.visual.ts --host 127.0.0.1 --port 4174 > /tmp/submission-hub-ui-contract.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4174/tests/visual/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/submission-hub-ui-contract.log
          exit 1
      - name: Verify boundaries, radii, spacing and journal terminology
        run: node tests/visual/ui-geometry-contract-check.mjs
      - name: Verify Journal Center filters, Preparation routes and standard four-column grid
        run: node tests/visual/journal-center-header-filter-check.mjs
      - name: Verify header actions, feedback popup and navigation parity
        run: node tests/visual/header-action-coherence-check.mjs
      - name: Verify responsive workspace density at zoom-equivalent viewports
        run: node tests/visual/responsive-workspace-density-check.mjs
      - name: Verify submission grid parity across Luminous and Luminous X
        run: node tests/visual/submission-grid-parity-check.mjs
      - name: Verify dark theme blue-gray palette and readability
        run: node tests/visual/dark-theme-contract-check.mjs
