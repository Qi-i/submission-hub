name: Sync v2.1.0 Package Metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/online-figure-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/online-figure-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: version
        name: Check current package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Synchronize package and lock versions
        if: steps.version.outputs.current != '2.1.0'
        run: npm version 2.1.0 --no-git-tag-version
      - name: Commit synchronized metadata
        if: steps.version.outputs.current != '2.1.0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "release: prepare v2.1.0 online edition"
          git push origin HEAD:feat/online-figure-studio
