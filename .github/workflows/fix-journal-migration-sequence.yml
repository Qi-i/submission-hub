name: Fix journal migration sequence

on:
  push:
    branches:
      - agent/add-journal-selection-metadata
    paths:
      - .github/workflows/fix-journal-migration-sequence.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-journal-selection-metadata
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python scripts/fix-journal-migration-sequence.py
      - run: npm run verify
      - run: rm -f tsconfig.tsbuildinfo
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use unique migration sequence for journal metadata"
          git push origin HEAD:agent/add-journal-selection-metadata
