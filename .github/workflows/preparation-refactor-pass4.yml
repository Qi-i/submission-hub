name: Apply Preparation Refactor Pass 4

on:
  workflow_dispatch:
  push:
    branches: [refactor/preparation-unified-workspace]
    paths:
      - 'docs/superpowers/plans/.execution-marker'

permissions:
  contents: write

concurrency:
  group: preparation-refactor-pass4
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/preparation-unified-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply convergence refactor
        run: node scripts/apply-preparation-refactor-pass4.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify architecture and types
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-verification-key
          VITE_ADMIN_ID: build-verification-admin
        run: |
          npm run typecheck
          node tests/figure-studio-contract.mjs
          node tests/preparation-unified-contract.mjs
          npm run build
      - name: Remove temporary executor
        run: rm -f scripts/apply-preparation-refactor-pass4.mjs .github/workflows/preparation-refactor-pass4.yml
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Converge Preparation navigation and Journal Center routes"
          git push origin HEAD:refactor/preparation-unified-workspace
