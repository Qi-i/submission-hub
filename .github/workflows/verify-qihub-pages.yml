name: Verify QiHub static launcher on GitHub Pages
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qihub-pages-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Compare every live static resource with the reviewed source
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
            echo "::notice::A newer main superseded the deployment under review."
            exit 0
          fi
          local_dir="public/qihub"
          expected="$(jq -r '.sha' "$local_dir/build-info.json")"
          test "$(jq -r '.sourceSha' "$local_dir/publish-info.json")" = "$expected"
          test "$(jq -r '.edition' "$local_dir/build-info.json")" = "web-aggregator"
          base="https://qi-i.github.io/submission-hub/qihub"
          actual=""
          for attempt in $(seq 1 36); do
            actual="$(curl -fsSL --connect-timeout 6 --max-time 12 \
              -H 'Cache-Control: no-cache' "$base/build-info.json?deploy=$DEPLOY_SHA&n=$attempt" | jq -r '.sha // empty' || true)"
            if [ "$actual" = "$expected" ]; then break; fi
            sleep 5
          done
          if [ "$actual" != "$expected" ]; then
            echo "::error::QiHub public manifest does not match source $expected; got $actual"
            exit 1
          fi
          count=0
          while IFS= read -r file; do
            rel="$(realpath --relative-to="$local_dir" "$file")"
            target="$(mktemp)"
            curl -fsSL --retry 4 --retry-delay 3 --connect-timeout 6 --max-time 20 \
              -H 'Cache-Control: no-cache' "$base/$rel?v=$expected" -o "$target"
            if ! cmp -s "$file" "$target"; then
              echo "::error::Live static asset differs from GitHub source: $rel"
              exit 1
            fi
            rm -f "$target"
            count=$((count+1))
          done < <(find "$local_dir" -type f | sort)
          if [ "$count" -ne 9 ]; then
            echo "::error::Expected 9 verified static assets, got $count"
            exit 1
          fi
          echo "QiHub live at $base/; $count byte-identical files; source $expected"
          {
            echo '## QiHub verified public URL'
            echo
            echo "- URL: $base/"
            echo "- Source SHA: $expected"
            echo "- Byte-identical files: $count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Chromium for real public QiHub UI review
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify deployed desktop and mobile UI with Chromium
        run: node scripts/verify-qihub-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qihub-public-desktop-mobile-review
          path: qihub-live-review/
          if-no-files-found: warn
          retention-days: 7
