name: Update Documentation Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/releases/**'
      - 'src/**'
      - 'tests/visual/**'
      - 'vite.config.visual.ts'
      - '.github/workflows/update-doc-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: update-doc-screenshots
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Synchronize package version
        run: npm version 1.5.0 --no-git-tag-version --allow-same-version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify sample privacy
        run: npm run check:privacy
      - name: Build visual harness
        run: npm run typecheck && npx vite build --config vite.config.visual.ts
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1
      - name: Start preview server
        run: |
          npx vite preview --config vite.config.visual.ts --host 127.0.0.1 --port 4174 > /tmp/submission-hub-docs.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/tests/visual/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/submission-hub-docs.log
          exit 1
      - name: Remove superseded documentation screenshots
        run: |
          rm -f \
            docs/screenshots/dashboard-dark.png \
            docs/screenshots/dashboard-mobile.png \
            docs/screenshots/dashboard-papers.png \
            docs/screenshots/editor-form.png \
            docs/screenshots/journal-library.png \
            docs/screenshots/journal-review-lookup.png \
            docs/screenshots/preparation-page.png \
            docs/screenshots/statistics-page.png
      - name: Capture Luminous main pages
        run: |
          set -euxo pipefail
          mkdir -p docs/screenshots visual-review
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="1440,1200" --wait-for-selector="html[data-ui='luminous'][data-visual-ready='true'] .paper-card-v3" "http://127.0.0.1:4174/tests/visual/index.html?view=dashboard&theme=light&ui=luminous" docs/screenshots/luminous-dashboard.png
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="1440,1200" --wait-for-selector="html[data-ui='luminous'][data-visual-ready='true'] .preparation-workspace" "http://127.0.0.1:4174/tests/visual/index.html?view=preparation&theme=light&ui=luminous" docs/screenshots/luminous-preparation.png
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="1440,1200" --wait-for-selector="html[data-ui='luminous'][data-visual-ready='true'] .stats-panel" "http://127.0.0.1:4174/tests/visual/index.html?view=stats&theme=light&ui=luminous" docs/screenshots/luminous-statistics.png
      - name: Capture Luminous X main pages
        run: |
          set -euxo pipefail
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="1440,1200" --wait-for-selector="html[data-ui='luminous-x'][data-visual-ready='true'] .paper-card-v3" "http://127.0.0.1:4174/tests/visual/index.html?view=dashboard&theme=light&ui=luminous-x" docs/screenshots/luminous-x-dashboard.png
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="1440,1200" --wait-for-selector="html[data-ui='luminous-x'][data-visual-ready='true'] .preparation-workspace" "http://127.0.0.1:4174/tests/visual/index.html?view=preparation&theme=light&ui=luminous-x" docs/screenshots/luminous-x-preparation.png
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="1440,1200" --wait-for-selector="html[data-ui='luminous-x'][data-visual-ready='true'] .stats-panel" "http://127.0.0.1:4174/tests/visual/index.html?view=stats&theme=light&ui=luminous-x" docs/screenshots/luminous-x-statistics.png
      - name: Capture journal libraries and review editor
        run: |
          set -euxo pipefail
          node tests/visual/journal-library-density-check.mjs
          cp visual-review/luminous-journal-library-light-desktop.png docs/screenshots/luminous-journals.png
          cp visual-review/luminous-x-journal-library-light-desktop.png docs/screenshots/luminous-x-journals.png
          cp visual-review/luminous-x-journal-review-lookup.png docs/screenshots/luminous-x-review-lookup.png
      - name: Capture responsive and editing views
        run: |
          set -euxo pipefail
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="1440,1200" --wait-for-selector="html[data-ui='luminous-x'][data-visual-ready='true'] .paper-card-v3" "http://127.0.0.1:4174/tests/visual/index.html?view=dashboard&theme=dark&ui=luminous-x" docs/screenshots/luminous-x-dark.png
          npx playwright screenshot --timeout=45000 --browser chromium --full-page --viewport-size="390,844" --wait-for-selector="html[data-ui='luminous-x'][data-visual-ready='true'] .paper-card-v3" "http://127.0.0.1:4174/tests/visual/index.html?view=dashboard&theme=light&ui=luminous-x" docs/screenshots/luminous-x-mobile.png
          npx playwright screenshot --timeout=45000 --browser chromium --viewport-size="1440,1000" --wait-for-selector="html[data-ui='luminous-x'][data-modal-scroll-ready='true'] .compact-form-footer" "http://127.0.0.1:4174/tests/visual/index.html?view=editor&theme=light&ui=luminous-x" docs/screenshots/luminous-x-editor.png
      - name: Verify generated screenshots
        run: |
          set -euxo pipefail
          for file in \
            luminous-dashboard luminous-preparation luminous-statistics luminous-journals \
            luminous-x-dashboard luminous-x-preparation luminous-x-statistics luminous-x-journals \
            luminous-x-review-lookup luminous-x-dark luminous-x-mobile luminous-x-editor; do
            test -s "docs/screenshots/${file}.png"
          done
      - name: Commit documentation assets and version metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A docs/screenshots package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Documentation screenshots and package version are current."
            exit 0
          fi
          git commit -m "Refresh dual-interface documentation screenshots"
          git push
