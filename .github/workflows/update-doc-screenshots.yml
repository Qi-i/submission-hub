name: Update Documentation Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/releases/**'
      - 'src/**'
      - 'tests/visual/**'
      - 'vite.config.visual.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update-doc-screenshots.yml'
  push:
    branches: [main, 'release/**']
    paths:
      - 'README.md'
      - 'docs/releases/**'
      - 'src/**'
      - 'tests/visual/**'
      - 'vite.config.visual.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update-doc-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: update-doc-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Synchronize package lock with package version
        run: |
          version="$(node -p "require('./package.json').version")"
          npm version "$version" --no-git-tag-version --allow-same-version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify sample privacy
        run: npm run check:privacy
      - name: Build visual harness
        run: npm run typecheck && npx vite build --config vite.config.visual.ts
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1
      - name: Start preview server
        run: |
          npx vite preview --config vite.config.visual.ts --host 127.0.0.1 --port 4174 > /tmp/submission-hub-docs.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/tests/visual/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/submission-hub-docs.log
          exit 1
      - name: Remove superseded documentation screenshots
        run: |
          rm -f \
            docs/screenshots/dashboard-dark.png \
            docs/screenshots/dashboard-mobile.png \
            docs/screenshots/dashboard-papers.png \
            docs/screenshots/editor-form.png \
            docs/screenshots/journal-library.png \
            docs/screenshots/journal-review-lookup.png \
            docs/screenshots/preparation-page.png \
            docs/screenshots/statistics-page.png
      - name: Capture fixed-ratio documentation screenshots
        run: node tests/visual/capture-documentation-screenshots.mjs
      - name: Verify generated screenshots
        run: |
          set -euxo pipefail
          for file in \
            luminous-dashboard luminous-preparation luminous-statistics luminous-journals \
            luminous-x-dashboard luminous-x-preparation luminous-x-statistics luminous-x-journals \
            luminous-x-review-lookup luminous-x-dark luminous-x-mobile luminous-x-editor; do
            test -s "docs/screenshots/${file}.png"
          done
      - name: Commit documentation assets and lock metadata
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A docs/screenshots package-lock.json
          if git diff --cached --quiet; then
            echo "Documentation screenshots and package lock are current."
            exit 0
          fi
          git commit -m "Update documentation screenshots and lock metadata"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
