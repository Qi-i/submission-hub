name: Apply journal selection metadata

on:
  push:
    branches:
      - agent/add-journal-selection-metadata
    paths:
      - .github/workflows/apply-journal-selection-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-journal-selection-metadata
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply targeted source changes
        run: python scripts/apply-journal-selection-metadata.py
      - name: Verify implementation
        run: npm run verify
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add translated journal selection metadata"
          git push origin HEAD:agent/add-journal-selection-metadata
