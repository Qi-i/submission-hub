name: Verify Submission Card Actions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/PaperCardEnhanced.tsx'
      - 'src/submission-card-actions.css'
      - 'src/app-styles.ts'
      - 'tests/visual/submission-card-actions-check.mjs'
      - 'tests/visual/**'
      - 'vite.config.visual.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/submission-card-actions.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/PaperCardEnhanced.tsx'
      - 'src/submission-card-actions.css'
      - 'src/app-styles.ts'
      - 'tests/visual/submission-card-actions-check.mjs'
      - 'tests/visual/**'
      - 'vite.config.visual.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/submission-card-actions.yml'

permissions:
  contents: read

concurrency:
  group: submission-card-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify privacy, types and production build
        run: npm run check:privacy && npm run typecheck && npm run build
      - name: Build visual harness
        run: npx vite build --config vite.config.visual.ts
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1
      - name: Start preview
        run: |
          npx vite preview --config vite.config.visual.ts --host 127.0.0.1 --port 4174 > /tmp/submission-card-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/tests/visual/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/submission-card-preview.log
          exit 1
      - name: Verify backend-first card behavior
        run: node tests/visual/submission-card-actions-check.mjs
