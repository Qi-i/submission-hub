name: Verify Online Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/**']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/**'
      - 'docs/releases/**'
      - 'README.md'
      - 'public/release-info.json'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/quality.yml'
      - '.github/workflows/release-online.yml'
      - '.github/workflows/update-doc-screenshots.yml'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release metadata consistency
        run: npm run check:release
      - name: Verify privacy-safe samples
        run: npm run check:privacy
      - name: Verify Figure Studio migration contract
        run: npm run check:figure-studio
      - name: Verify online-only maintenance contract
        run: npm run check:online-only
      - name: Verify automatic journal catalog
        run: node tests/journal-auto-catalog-check.mjs
      - name: Verify journal selection metadata
        run: npm run check:journal-selection
      - name: Verify journal rank display policy
        run: npm run check:journal-rank-display
      - name: Verify document storage lifecycle
        run: node tests/visual/document-storage-check.mjs
      - name: Build online app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-verification-key
          VITE_ADMIN_ID: build-verification-admin
