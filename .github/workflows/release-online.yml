name: Release Online Edition

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to package.json version
        required: false
      title:
        description: Optional release title
        required: false
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: release-online-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: metadata
        name: Resolve release metadata
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REQUESTED_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="${REQUESTED_TAG:-v${VERSION}}"
          RELEASE_TITLE="${REQUESTED_TITLE:-Submission Hub v${VERSION}}"
          RELEASE_NOTES="docs/releases/v${VERSION}.md"
          test "$TAG_NAME" = "v${VERSION}"
          test -s "$RELEASE_NOTES"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "notes=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete online verification
        run: npm run verify
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-verification-key
          VITE_ADMIN_ID: build-verification-admin
      - name: Package deployable web snapshot
        run: |
          mkdir -p release
          tar -czf "release/submission-hub-web-v${{ steps.metadata.outputs.version }}.tar.gz" -C dist .
          sha256sum "release/submission-hub-web-v${{ steps.metadata.outputs.version }}.tar.gz" > release/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite an immutable online release." >&2
            exit 1
          fi
          gh release create "$TAG_NAME" \
            "release/submission-hub-web-v${{ steps.metadata.outputs.version }}.tar.gz" \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            --latest
      - name: Publish release summary
        run: |
          {
            echo "## Released ${{ steps.metadata.outputs.tag }}"
            echo
            echo "- Verification: passed"
            echo "- Edition: online"
            echo "- Deployable snapshot: submission-hub-web-v${{ steps.metadata.outputs.version }}.tar.gz"
            echo "- Notes: ${{ steps.metadata.outputs.notes }}"
            echo "- GitHub Pages deployment is verified separately against build-info.json."
          } >> "$GITHUB_STEP_SUMMARY"
