name: Temporary refresh dark contract

on:
  push:
    branches:
      - fix/dark-card-readability-balance
    paths:
      - .github/workflows/_temporary-refresh-dark-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-card-readability-balance
          fetch-depth: 0
      - name: Refresh dark geometry contract
        run: python .github/refresh-dark-contract.py
      - name: Validate changes
        run: git diff --check
      - name: Commit changes and remove temporary helpers
        run: |
          rm .github/workflows/_temporary-refresh-dark-contract.yml .github/refresh-dark-contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align geometry contract with calm dark workspace"
          git push origin HEAD:fix/dark-card-readability-balance
