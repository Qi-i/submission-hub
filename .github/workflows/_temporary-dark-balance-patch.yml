name: Temporary dark balance patch

on:
  push:
    branches:
      - fix/dark-card-readability-balance
    paths:
      - .github/workflows/_temporary-dark-balance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-card-readability-balance
          fetch-depth: 0
      - name: Apply dark balance patch
        run: python .github/dark-balance-patch.py
      - name: Validate changes
        run: git diff --check
      - name: Commit changes and remove temporary helpers
        run: |
          rm .github/workflows/_temporary-dark-balance-patch.yml .github/dark-balance-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance dark cards and restore readable attachment marks"
          git push origin HEAD:fix/dark-card-readability-balance
