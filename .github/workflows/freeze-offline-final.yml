name: Freeze Final Offline Release

on:
  push:
    branches: ['release/offline-final-20260820']
    paths:
      - '.github/workflows/freeze-offline-final.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify current online and offline source
        run: npm run verify
      - name: Prepare final offline asset
        run: |
          mkdir -p release
          cp dist-offline/offline.html release/submission-hub-offline-final-v2.0.0.html
          sha256sum release/submission-hub-offline-final-v2.0.0.html > release/SHA256SUMS.txt
      - name: Create immutable final offline release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: offline-final-v2.0.0
          TARGET_SHA: 830cd645ee74f33ab41fd28e4bbafcd1fee31841
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite frozen offline artifact." >&2
            exit 1
          fi
          cat > release/notes.md <<'EOF'
          # Submission Hub — Final Offline Edition

          This is the final maintained single-HTML offline build of Submission Hub.

          - Frozen source: `830cd645ee74f33ab41fd28e4bbafcd1fee31841`
          - Data storage: browser local storage only
          - Supabase: not required
          - Network-independent core workflow: retained
          - Future development: online edition only

          The offline artifact is frozen and will not receive features introduced after this release.
          EOF
          gh release create "$TAG_NAME" \
            release/submission-hub-offline-final-v2.0.0.html \
            release/SHA256SUMS.txt \
            --target "$TARGET_SHA" \
            --title "Submission Hub Final Offline Edition" \
            --notes-file release/notes.md
      - name: Summary
        run: |
          echo '## Final offline edition frozen' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source SHA: `830cd645ee74f33ab41fd28e4bbafcd1fee31841`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Release: `offline-final-v2.0.0`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Future builds: online edition only' >> "$GITHUB_STEP_SUMMARY"
