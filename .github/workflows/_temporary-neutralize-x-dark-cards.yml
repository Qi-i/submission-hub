name: Temporary neutralize X dark cards

on:
  push:
    branches:
      - fix/dark-card-readability-balance
    paths:
      - .github/workflows/_temporary-neutralize-x-dark-cards.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-card-readability-balance
          fetch-depth: 0
      - name: Neutralize Luminous X dark card interiors
        run: python .github/neutralize-x-dark-cards.py
      - name: Validate changes
        run: git diff --check
      - name: Commit changes and remove temporary helpers
        run: |
          rm .github/workflows/_temporary-neutralize-x-dark-cards.yml .github/neutralize-x-dark-cards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Neutralize Luminous X dark card interiors"
          git push origin HEAD:fix/dark-card-readability-balance
