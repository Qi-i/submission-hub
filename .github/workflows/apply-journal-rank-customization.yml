name: Apply journal rank display customization

on:
  push:
    branches:
      - agent/customize-journal-rank-display
    paths:
      - scripts/apply-journal-rank-customization.mjs
      - .github/workflows/apply-journal-rank-customization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customize-journal-rank-display
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-journal-rank-customization.mjs
      - name: Commit patched files
        run: |
          git config user.name "submission-hub-bot"
          git config user.email "submission-hub-bot@users.noreply.github.com"
          git add -A
          git commit -m "Customize EasyScholar card labels and journal identity" 
          git push origin HEAD:agent/customize-journal-rank-display
