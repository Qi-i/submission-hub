name: 功能建议
description: 提交新功能、交互优化或使用流程建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请说明具体使用场景和预期价值。请勿提交真实论文、账号或其他敏感信息。

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 投稿准备
        - 投稿管理
        - 期刊库
        - 个人统计
        - 数据导入与备份
        - 账户与设置
        - 界面与交互
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 当前在哪个流程中遇到不便？
      placeholder: 当我进行……时，目前需要……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述希望增加或调整的功能及交互方式。
      placeholder: 建议增加……，入口位于……，用于……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方法
      description: 目前如何完成这项工作？此项可选。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我未提交账号、令牌、真实论文内容及其他敏感信息。
          required: true
